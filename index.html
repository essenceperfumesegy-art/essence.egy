<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Essence | Luxury Perfumes</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <nav class="navbar">
        <div class="logo">ESSENCE</div>
        <div class="nav-icons">
            <span class="cart-icon" onclick="toggleCart()">🛒 Cart (0)</span>
        </div>
    </nav>

    <header class="hero">
        <div class="hero-content">
            <h1>Discover Your True Essence</h1>
            <button class="cta-button" onclick="document.getElementById('products').scrollIntoView()">Shop Now</button>
        </div>
    </header>

    <main id="products">
        <h2 style="text-align:center; padding-top:40px;">Signature Scents</h2>
        <div class="product-grid" id="product-list"></div>
    </main>

    <section class="reviews-section">
        <h2>Verified Essence Lovers</h2>
        <div class="review-card">
            <p>"Midnight Rose is my absolute signature! 🌹 #EssenceAddict"</p>
            <span>— @sarah_perfumes</span>
        </div>
    </section>

    <script src="app.js"></script>
</body>
</html>
